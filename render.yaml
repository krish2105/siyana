# Render blueprint: API web service + Postgres. pgvector is available on Render Postgres 16.
services:
  - type: web
    name: siyana-api
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: python db/migrate.py && uvicorn services.gateway.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siyana-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://siyana.vercel.app
      - key: SIYANA_DATA_DIR
        value: ./data
      - key: SIYANA_ATA_CLASSIFIER
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
databases:
  - name: siyana-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
