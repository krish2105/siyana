# Render blueprint: API web service + Postgres. pgvector is available on Render Postgres 16.
services:
  - type: web
    name: siyana-api
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: python db/migrate.py && uvicorn services.gateway.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # any Postgres 16+ with pgvector; the live deployment uses a Supabase schema
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://siyana-six.vercel.app
      - key: SIYANA_EMBED_BACKEND
        value: fastembed
      - key: SIYANA_ENABLE_NAZAR
        value: "0"
      - key: SIYANA_SKIP_VECTOR_INDEX
        value: "1"
      - key: SIYANA_DATA_DIR
        value: ./data
      - key: SIYANA_ATA_CLASSIFIER
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
# Optional: a Render Postgres instead of Supabase. Requires a paid plan for 5 GB storage.
