# Render blueprint: API web service + Postgres. pgvector is available on Render Postgres 16.
services:
  - type: web
    name: siyana-api
    runtime: docker
    dockerfilePath: services/gateway/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siyana-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://siyana.vercel.app
      - key: SIYANA_DATA_DIR
        value: /app/data
databases:
  - name: siyana-db
    plan: basic-256mb
    postgresMajorVersion: "16"
