services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: siyana
      POSTGRES_PASSWORD: siyana
      POSTGRES_DB: siyana
    ports:
      - "5433:5432"   # 5433 on the host so a local Postgres on 5432 is left alone
    volumes:
      - siyana_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siyana -d siyana"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://siyana:siyana@db:5432/siyana
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      SIYANA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  siyana_db:
