name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: siyana
          POSTGRES_PASSWORD: siyana
          POSTGRES_DB: siyana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siyana -d siyana" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://siyana:siyana@localhost:5432/siyana
      SIYANA_EMBED_BACKEND: fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-render.txt
      - run: python db/migrate.py
      - run: python -m pytest -q -m "not slow"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/contrast.mjs
      - run: npm run build
