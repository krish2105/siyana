name: ingest-weekly
# Keeps the live corpus current: every Monday pull the previous week of FAA SDRS records into the
# production database, embed them, re-run the recurrence scan and the hangar schedule.
on:
  schedule:
    - cron: "30 2 * * 1"   # 02:30 UTC Mondays (08:00 IST)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull (ignored when from/to are set)"
        default: "7"
      from:
        description: "Backfill start date YYYY-MM-DD (optional)"
        default: ""
      to:
        description: "Backfill end date YYYY-MM-DD (optional)"
        default: ""
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SIYANA_EMBED_BACKEND: fastembed
      SIYANA_ATA_CLASSIFIER: "0"
      SIYANA_SKIP_VECTOR_INDEX: "1"
      SIYANA_INGEST_FAMILIES: "B737,A320,A321,A319,E170,E190,CRJ"   # the deployed narrow-body corpus; unset for everything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-render.txt
      - name: Pull SDRS (last week, or the backfill range given)
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          FROM="${{ github.event.inputs.from }}"; TO="${{ github.event.inputs.to }}"
          if [ -z "$FROM" ]; then FROM=$(date -u -d "-$DAYS days" +%Y-%m-%d); fi
          if [ -z "$TO" ]; then TO=$(date -u -d "-1 day" +%Y-%m-%d); fi
          python -m ingest.sdrs --from "$FROM" --to "$TO" --days 7
      - run: python -m services.daleel.embed
      - run: python -m ingest.fleet --families A320 A321 B737 --n 24
      - run: python -m services.daleel.recurrence --limit 300
      - run: python -m ingest.cmapss
      - run: python -m services.ajal.watchlist
      - run: python -m services.ajal.seed_schedule
      - name: Readiness after refresh
        run: python -c "from services.gateway.main import ready; print(ready())"
